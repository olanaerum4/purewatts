<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<div id="root"></div>

<script type="text/babel">
// ── Palette ───────────────────────────────────────────────────────────────
const wf = {
  bg: '#f9f8f5', bg2: '#ede9e0', border: '#2a2a2a',
  text: '#1a1a1a', muted: '#888', light: '#d0cdc5',
  lime: '#b5e831', amber: '#fbbf24', blue: '#93c5fd',
  white: '#ffffff', tag: '#eae7e0',
};

// ── Primitive atoms ────────────────────────────────────────────────────────

const Img = ({ w, h, label = 'image' }) => (
  <div style={{ width: w, height: h, background: '#e0ddd5', border: `1.5px solid ${wf.light}`, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden', flexShrink: 0 }}>
    <svg width="100%" height="100%" style={{ position: 'absolute', top: 0, left: 0 }} preserveAspectRatio="none">
      <line x1="0" y1="0" x2="100%" y2="100%" stroke="#c5c0b5" strokeWidth="1.5" />
      <line x1="100%" y1="0" x2="0" y2="100%" stroke="#c5c0b5" strokeWidth="1.5" />
    </svg>
    {label && <span style={{ fontFamily: 'Caveat', fontSize: 12, color: '#aaa', position: 'relative', zIndex: 1, textAlign: 'center', padding: '0 6px' }}>{label}</span>}
  </div>
);

const Badge = ({ text, color = wf.lime, size = 14 }) => (
  <span style={{ background: color, border: `2px solid ${wf.border}`, borderRadius: 3, padding: '1px 7px', fontFamily: 'Caveat', fontWeight: 700, fontSize: size, color: wf.text, whiteSpace: 'nowrap', display: 'inline-block' }}>{text}</span>
);

const Btn = ({ text, fill = false, small = false }) => (
  <div style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: fill ? wf.border : 'transparent', color: fill ? '#fff' : wf.border, border: `2px solid ${wf.border}`, borderRadius: 4, padding: small ? '3px 11px' : '7px 18px', fontFamily: 'Caveat', fontWeight: 700, fontSize: small ? 13 : 15, cursor: 'pointer', whiteSpace: 'nowrap' }}>{text}</div>
);

const Stars = ({ n = '4.8', count }) => (
  <span style={{ fontFamily: 'Caveat', fontSize: 13 }}>
    <span style={{ color: '#f59e0b' }}>★★★★★</span> <span style={{ color: wf.text }}>{n}</span>
    {count && <span style={{ color: wf.muted }}> ({count})</span>}
  </span>
);

const Tag = ({ text }) => (
  <span style={{ border: `1.5px solid ${wf.light}`, borderRadius: 10, padding: '1px 8px', fontFamily: 'Caveat', fontSize: 12, color: wf.muted, background: wf.tag, whiteSpace: 'nowrap' }}>{text}</span>
);

const Divider = ({ m = '8px 0' }) => (
  <div style={{ borderTop: `1.5px dashed ${wf.light}`, margin: m }} />
);

);

const GridCard = ({ name, save, stars, price, cat, compact = false }) => (

      <div style={{ position: 'absolute', top: 8, left: 8 }}>
        <Badge text={`SAVE ${save}`} size={compact ? 14 : 16} />
      </div>
    </div>
    <div style={{ padding: compact ? '7px 8px' : '9px 12px', display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 4 }}>
